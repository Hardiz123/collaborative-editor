[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:go-backend]
command=/root/server
directory=/root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/go-backend.err.log
stdout_logfile=/var/log/supervisor/go-backend.out.log
environment=PORT="8080"

[program:yjs-server]
command=node server.js
directory=/root/yjs-server
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/yjs-server.err.log
stdout_logfile=/var/log/supervisor/yjs-server.out.log
environment=PORT="8081",HOST="0.0.0.0",NODE_ENV="production"
